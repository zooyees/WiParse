# WiParse Testing Hub marketplace — TLS terminator in front of Node :8787
#
# 1. Replace market.example.com
# 2. Point cert paths at Aliyun PEM or Let's Encrypt
# 3. ln -s this file into sites-enabled; nginx -t && systemctl reload nginx
#
# Node must stay on 127.0.0.1:8787. Do not open 8787 on the security group.

upstream wiparse_marketplace {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name market.example.com;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name market.example.com;

    # Aliyun SSL download, or:
    #   ssl_certificate     /etc/letsencrypt/live/market.example.com/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/market.example.com/privkey.pem;
    ssl_certificate     /etc/nginx/ssl/market.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/market.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    # Publish body is zip as base64 JSON (~1.37 × zip size).
    client_max_body_size 64m;

    location / {
        proxy_pass http://wiparse_marketplace;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Optional: restrict catalog/download to factory egress IPs.
    # allow 1.2.3.0/24;
    # deny all;
}
