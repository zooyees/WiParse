[package]
name = "wiparse-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WiParse desktop GUI (egui) — layout parity with Python MonitorWindow"

[[bin]]
name = "wiparse-gui"
path = "src/main.rs"

[dependencies]
wiparse-core = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_plot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossbeam-channel = { workspace = true }
rayon = { workspace = true }
dirs = { workspace = true }
ureq = { version = "2", default-features = false, features = ["tls"] }
rfd = { workspace = true }
chrono = { workspace = true }
tiny_http = "0.12"
rusqlite = { workspace = true }
# ICO app icon + PNG/JPEG report/scope captures. Avoid default-features (AVIF/EXR/…).
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg"] }

[build-dependencies]
winresource = "0.1"
